name: PR Validate

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Run inside the same image the engine .deb is built against: igloo is
    # preinstalled, and the tinyxml2 / SDL sonames match the engine library
    # (a bare ubuntu runner ships newer sonames and fails to link).
    container: storminator16/igloo-testing:latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout (with the pinned Storm Engine v2 submodule)
        uses: actions/checkout@v7
        with:
          # THE ENGINE IS THE SUBMODULE, so it has to be here. The build no longer
          # falls back to a system install: that fallback is how this repo and CI
          # came to run different engines (2.3.0 installed locally, 2.3.1 in CI).
          submodules: true

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential binutils curl jq ca-certificates zstd xz-utils \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev \
            libglm-dev libtinyxml2-dev liblua5.4-dev libsqlite3-dev

      - name: Storm Engine v2's tinyxml2 (the engine compiles it IN)
        # The engine's Makefile.debian builds vendor/android/tinyxml2 rather than
        # linking a system copy, so a from-source build fails without it. It is a
        # NESTED submodule, so it can only be addressed from inside the engine --
        # `git submodule update <nested path>` from this repo fails with
        # "pathspec ... did not match any file(s) known to git".
        run: |
          git -C external/storm-engine-v2 submodule update --init --depth 1 \
            vendor/android/tinyxml2

      - name: Build and test every pattern
        run: |
          set -e
          # Patterns live at varying depths (patterns/<name> or
          # patterns/<category>/<name>); test any folder that has a Makefile.
          # POSIX loop — the container's default shell is dash, not bash.
          find patterns -name Makefile | while read -r mk; do
            dir=$(dirname "$mk")
            echo "::group::${dir}"
            # ALL THREE, and the first one is the point: `make` builds the
            # example, `make test` builds the specs, `make run-test` runs them.
            # CI used to run only the last two, so when the default goal silently
            # became the engine library and a bare `make` stopped building the
            # example, every pattern was broken and the suite stayed green.
            make -C "$dir"
            make -C "$dir" test
            make -C "$dir" run-test
            echo "::endgroup::"
          done
